name: Build & Deploy

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Git config
        run: |
          git config --global user.email "realacessoriosdev@gmail.com"
          git config --global user.name "realacessorios-dev"

      - name: Bump Version
        run: |
          npm version patch

      - name: Push changes to repository
        run: |
          git push origin HEAD --force
          git push origin HEAD --tags --force

        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run buildGit

      - name: Zip files
        run: |
          cp package.json ui-siap
          zip -r ui-siap.zip ui-siap
          chmod 644 ui-siap.zip

      - name: Debug da existência de 'ui-siap.zip'
        run: |
          ls -al $GITHUB_WORKSPACE

      - name: rsync deployment
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avz --include=ui-siap.zip --exclude=*
          remote_path: ${{ secrets.SERVER_60_DESTINATION_PATH }}
          remote_host: ${{ secrets.SERVER_60_HOST }}
          remote_user: ${{ secrets.SERVER_60_USER }}
          remote_key: ${{ secrets.SERVER_60_PRIVATE_KEY }}
          remote_port: ${{ secrets.SERVER_60_PORT }}
